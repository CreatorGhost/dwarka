<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frontend lifecycle fixture</title>
    <style>
      #evidence-label{position:fixed;z-index:10000;top:12px;left:12px;max-width:560px;padding:10px 14px;border:2px solid #f2bf58;background:#080b18ee;color:#fff;font:700 14px/1.4 system-ui;white-space:pre-line}
      .diagnostic{min-height:100vh;box-sizing:border-box;padding:90px 64px;background:#090d19;color:#f7f2e8;font:18px/1.5 system-ui}.diagnostic h1{font-size:32px}.diagnostic table{border-collapse:collapse;width:min(100%,1000px)}.diagnostic th,.diagnostic td{border:1px solid #596174;padding:12px;text-align:left}.diagnostic .pass{color:#9ce6ad}.diagnostic .fail{color:#ffb0a8}
    </style>
  </head>
  <body>
    <aside id="evidence-label" hidden></aside>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
